<!DOCTYPE html>
<html>
<head>
  <title>Confidence Mirror</title>

  <style>
    body {
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 20px;
      overflow: hidden;
    }

    /* Spider swing animation */
    .spider {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      animation: swing 4s ease-in-out infinite;
    }

    .thread {
      width: 2px;
      height: 120px;
      background: white;
      margin: auto;
    }

    .body {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ef4444, #1e3a8a);
      border-radius: 50%;
      margin: auto;
    }

    @keyframes swing {
      0%   { transform: translateX(-50%) rotate(-8deg); }
      50%  { transform: translateX(-50%) rotate(8deg); }
      100% { transform: translateX(-50%) rotate(-8deg); }
    }

    video {
      width: 85%;
      max-width: 420px;
      border-radius: 16px;
      border: 4px solid #ef4444;
      margin-top: 80px;
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h2 {
      margin-top: 20px;
      font-size: 24px;
      color: #22c55e;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #22c55e; }
      to   { text-shadow: 0 0 15px #22c55e; }
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #ef4444;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Spider animation -->
  <div class="spider">
    <div class="thread"></div>
    <div class="body"></div>
  </div>

  <h1>One Question</h1>
  <p>Can I access your camera?</p>

  <button onclick="startCamera()">Yes</button>

  <br>
  <video id="cam" autoplay></video>

  <h2 id="text"></h2>

  <script>
    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          document.getElementById("cam").srcObject = stream;
          document.getElementById("text").innerText =
            "You are the most beautiful and prettiest person ✨";
        })
        .catch(() => alert("Camera permission denied"));
    }
  </script>

</body>
</html>
